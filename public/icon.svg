<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Camera Body -->
  <rect x="96" y="140" width="320" height="232" rx="36" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <path d="M192 140 L220 96 L292 96 L320 140 Z" fill="#334155" stroke="#38bdf8" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Camera Lens with GPS Target -->
  <circle cx="256" cy="256" r="76" fill="#0f172a" stroke="url(#lensGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="44" fill="#0284c7" fill-opacity="0.3" />
  
  <!-- GPS Crosshairs -->
  <line x1="256" y1="196" x2="256" y2="216" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="296" x2="256" y2="316" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="196" y1="256" x2="216" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="296" y1="256" x2="316" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="8" fill="#38bdf8" />
  
  <!-- Flash & Sensor -->
  <circle cx="360" cy="180" r="14" fill="#fbbf24" />
  <rect x="130" y="174" width="36" height="12" rx="6" fill="#64748b" />

  <!-- Metadata badge -->
  <rect x="156" y="394" width="200" height="36" rx="18" fill="#0ea5e9" />
  <text x="256" y="418" fill="#ffffff" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">CAMMETA GPS</text>
</svg>
